aid: lalamove
name: Lalamove
description: >-
  Lalamove is a Hong Kong-founded on-demand logistics and same-day delivery
  platform operating across Asia and Latin America, matching businesses and
  consumers with a fleet of motorcycle, car, van and truck drivers. Its Delivery
  API (v3) lets partners programmatically request quotations, place and edit
  delivery orders, track assigned drivers in real time, add priority fees, and
  receive order lifecycle webhooks. The REST API is authenticated with HMAC
  SHA256 request signing, is segmented by market via a UN/LOCODE `Market`
  header, and is available in eleven markets including Hong Kong SAR, Singapore,
  Malaysia, Thailand, Philippines, Indonesia, Vietnam, Taiwan, Japan, Mexico and
  Brazil. Lalamove publishes a sandbox environment, a Node.js SDK, multi-language
  code examples, and a public status page.
