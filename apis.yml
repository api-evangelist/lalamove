apis:
- aid: lalamove:lalamove-delivery-api
  name: Lalamove Delivery API
  description: >-
    The Lalamove Delivery API (v3) is a REST API for on-demand and scheduled
    courier delivery. Partners request a quotation for a route of stops, place an
    order against that quotation, retrieve order and driver details, edit
    drop-off locations before pickup, cancel orders within the policy window,
    change the assigned driver, and add a priority fee to speed up matching.
    Order lifecycle events are pushed to a partner-configured webhook URL.
    Requests are signed with HMAC SHA256 and scoped to a market with the
    `Market` header.
