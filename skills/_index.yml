agent_safety_notes:
  - >-
    The API supports no idempotency key. Blind retries of POST /v3/orders or
    POST /v3/orders/{orderId}/priority-fee can dispatch duplicate couriers or
    stack fees. Always reconcile with GET /v3/orders/{orderId} first.
